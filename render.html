<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Embedded Groove</title>

	<script src="./js/abc2svg-1.min.js"></script>
	<script src="./js/groove_render.js"></script>
	<script>
		window.addEventListener('DOMContentLoaded', function () {
			var search = window.location.search || '';
			var data = new GrooveData().fromUrl(search);

			var svgTarget = document.getElementById("svgTarget");
			var renderWidth = 600;
			var fullAbc = data.getAbcHeader(false, renderWidth, data.showLegend) + data.getAbcNotation();
			console.log(fullAbc);
			var svgReturn = GrooveRenderer.renderABCtoSVG(fullAbc);

			var editorUrl = data.toEditorUrl();
			svgTarget.innerHTML = '<a target="_blank" style="text-decoration: none" href="' + editorUrl + '">' + svgReturn.svg + '</a>';
		});
	</script>
	<style>
		body {
			overflow: hidden; /* hide scrollbars */
			margin: 0;
			padding: 4px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

		.Printable {
			display: block;
		}
		.nonPrintable {
			display: block;
		}
		.svgTarget {
			width: 100%;
			display: inline-block;
		}
		.svgTarget svg {
			width: 100%;
			height: auto;
		}
		.abcr {  /* rectangles enclosing notes in ABC SVG */
			fill: transparent;
			fill-opacity: 0.25;
		}
		.abcr.highlighted {
			fill: #2484C0 !important;
			fill-opacity: 0.20;
		}
	</style>
</head>

<body>
	<!-- groove displays here -->
	<div id="GrooveDisplayId">
		<div class="Printable">
			<div id="svgTarget" class="svgTarget"></div>
		</div>
	</div>
</body>

</html>
